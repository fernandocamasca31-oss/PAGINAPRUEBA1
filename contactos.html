<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADIDAS | CONTACTOS</title>
            <link rel="shortcut icon" href="img/adidaslogo_icon2.png">
            <link rel="stylesheet" href="css/estilos-web.css">
    <link rel="stylesheet" href="css/contactos.css">
</head>
<body>

        <div class="container">
        <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="cd53c601-377b-4520-b669-51ff1e293b2d">
                <h2><i class="fa-solid fa-envelope"></i>Contacto</h2>
                <p class="subtitle">Ingresa tus datos correctamente
                    y pronto te responderemos  a tu correo.
                </p>
                <div class="input-group">
                    <label for="name"><i class="fa-solid fa-user">Nombre</i></label>
                    <input type="text" name="name" id="name" 
                    placeholder="Ingresa tus nombres" required>
                    <label for="phone"><i class="fa-solid fa-user">Teléfono</i></label>
                    <input type="tel" name="phone" id="phone"
                    placeholder="Agrega tu número" required>
                    <label for="email"><i class="fa-solid fa-user">Email</i></label>
                    <input type="email" name="email" id="email"
                    placeholder="Ingresa tu email" required>
                    <label for="menssage"><i class="fa-solid fa-comment-dots">
                        Mensaje
                    </i></label>
                    <textarea name="menssage" id="menssage" rows="4"
                    placeholder="¿En qué podemos ayudarte?"></textarea>
                    <div class="form-links">
                        <a href="#">Política de Privacidad</a>
                        <a href="#">Política de Privacidad</a>
                    </div>
                    <button type="submit" class="btn">
                        <span>Enviar Mensaje</span>
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                    </div>
                </div>
        </form>
    </div>
</body>
</html>
